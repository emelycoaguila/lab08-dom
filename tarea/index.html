
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi lista de tareas</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 30px auto;
        padding: 20px;
        background: #f4f6f9;
    }

    h1 {
        color: #243b53;
    }

    #listaTareas {
        padding: 0;
        list-style: none;
    }

    #listaTareas li {
        background: white;
        padding: 12px;
        margin-bottom: 8px;
        border-radius: 6px;
    }
    </style>
</head>
<body>
    <h1>Mi lista de tareas</h1>

<p>Mis actividades pendientes:</p>

<form id="formTarea">
    <input
    type="text"
    id="nombreTarea"
    placeholder="Escribe una tarea">
    <button type="submit">Agregar tarea</button>
</form>

<input
type="text"
id="buscarTarea"
placeholder="Buscar tarea"
>

<p id="mensaje"></p>

<ul id="listaTareas"></ul>

    <script src="app.js"></script>
</body>
</html>
